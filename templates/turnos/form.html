{% extends "base.html" %}

{% block contenido %}

<h1>
    {% if turno %}
        Editar turno
    {% else %}
        Nuevo turno
    {% endif %}
</h1>

<form method="POST">

    <div>
        <label>Fecha y Hora</label>
        <input type="datetime-local" name="fecha_hora" required>
    </div>

    <div>
        <label>Observaciones</label>
        <input type="text" name="observaciones" value="{{ servicio.observaciones if servicio else '' }}">
    </div>

    <button type="submit">
        Guardar
    </button>

</form>

{% endblock %}
